<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pazzle Admin</title><link rel="stylesheet" href="pazzle.css"><link rel="stylesheet" href="control-room.css"></head>
<body class="admin-body"><header class="site-header"><a class="wordmark" href="/"><span>PAZ</span>ZLE</a><nav><a href="/">Public site</a><button id="admin-logout">Log out</button></nav></header>
<main class="admin-main"><div class="section-kicker">Restricted</div><h1>Control room</h1><p id="admin-status">Checking admin access…</p>
  <section id="admin-panel" class="hidden">
    <div class="admin-tabs"><button data-panel="overview" class="active">Overview</button><button data-panel="puzzles">Puzzles</button><button data-panel="teams">Teams</button><button data-panel="settings">Introduction</button></div>
    <div id="overview-panel" class="admin-panel"><div id="admin-stats" class="stat-grid"></div></div>
    <div id="puzzles-panel" class="admin-panel hidden"><div class="panel-heading"><h2>Puzzles and solutions</h2><button id="add-puzzle" class="primary">Add puzzle</button></div><div id="admin-puzzles"></div></div>
    <div id="teams-panel" class="admin-panel hidden"><h2>Teams and players</h2><div class="table-wrap"><table><thead><tr><th>Team</th><th>Email</th><th>Level</th><th>Solved</th><th>Leaderboard</th><th>Actions</th></tr></thead><tbody id="admin-teams"></tbody></table></div></div>
    <div id="settings-panel" class="admin-panel hidden"><h2>Homepage introduction</h2><form id="intro-form" class="stack"><label>Introduction<textarea name="intro" rows="7"></textarea></label><button class="primary">Save introduction</button></form></div>
  </section>
</main><script src="control-room.js" defer></script></body></html>
